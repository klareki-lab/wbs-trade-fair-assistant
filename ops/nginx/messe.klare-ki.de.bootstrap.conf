# WBS Trade Fair Assistant — temporary HTTP-only vhost for ACME HTTP-01.
#
# Enable this file BEFORE running certbot so that certbot --nginx can modify
# a known-good HTTP server block in place during issuance. After the cert is
# issued, replace sites-available/messe.klare-ki.de with the HTTPS holding
# vhost and reload. Enable the final proxy only after Gateway acceptance.
#
# This file alone never serves traffic beyond a 503 holding response; it only
# exists so that nginx has a server_name match for the challenge handshake.

server {
    listen 80;
    listen [::]:80;
    server_name messe.klare-ki.de;

    # Return a holding 503 for everything until the HTTPS vhost is enabled.
    # Keeps the hostname reachable (so DNS can be verified independently)
    # without exposing any application behavior over plain HTTP.
    location / {
        default_type text/plain;
        return 503 "WBS Trade Fair Assistant: HTTPS not yet enabled.\n";
    }
}
