# WBS Trade Fair Assistant — final HTTPS vhost
#
# Proxies https://messe.klare-ki.de to the loopback Gateway on
# 127.0.0.1:3000. No path rewrite. No forward to n8n or any other service.
#
# WARNING: Install this file only AFTER:
#   1. The ACME HTTP-01 certificate for messe.klare-ki.de has been issued
#      (certbot --nginx against the bootstrap vhost).
#   2. The production Gateway has been recreated with
#      APP_ORIGIN=https://messe.klare-ki.de and loopback acceptance has
#      passed. The holding HTTPS vhost (see .https-holding.conf) must sit
#      between cert issuance and this file.
#
# HSTS: this file ships WITHOUT an HSTS header. Enable the staged header
# only after HTTPS acceptance passes externally — see
# docs/WBS_TF_06_F3B_PREP.md §7 "Staged HSTS".

server {
    listen 80;
    listen [::]:80;
    server_name messe.klare-ki.de;

    # ACME HTTP-01 renewal via certbot --nginx is handled by certbot
    # editing this block during renewal. Everything else redirects.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name messe.klare-ki.de;

    ssl_certificate     /etc/letsencrypt/live/messe.klare-ki.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messe.klare-ki.de/privkey.pem;
    # Site-level TLS protocols inherit from /etc/nginx/nginx.conf
    # (TLSv1.2 TLSv1.3, ssl_prefer_server_ciphers on).

    # Staged HSTS — DO NOT uncomment during initial cutover.
    # Enable the short line only after external HTTPS acceptance passes
    # (see docs/WBS_TF_06_F3B_PREP.md §7). Raise to the long line only
    # after at least 7 days of stable operation. Both are host-only
    # (no includeSubDomains, no preload) by design.
    # add_header Strict-Transport-Security "max-age=300" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The Gateway already sends Content-Security-Policy, X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy, Permissions-Policy, Cache-Control.
    # Do NOT duplicate those here; duplicates would stack and defeat `no-store`.

    client_max_body_size 1m;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    # Preserve the exact request path and query — Gateway routes on them.
    # Do not add a trailing slash to proxy_pass and do not add any rewrite.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve what Gateway needs for Origin + request binding.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # Origin: Gateway performs strict equality against APP_ORIGIN using the
        # browser-supplied Origin header. Do NOT set or overwrite proxy Origin.

        # Keep response headers from Gateway intact (CSP, Set-Cookie, etc.).
        proxy_pass_request_headers on;
        proxy_hide_header X-Powered-By;

        proxy_buffering off;
    }
}
