# WBS Trade Fair Assistant — HTTPS vhost
#
# Target: proxy a single HTTPS origin https://messe.klare-ki.de to the
# existing loopback Gateway on 127.0.0.1:3000 without rewriting request
# paths. No forward to n8n or any other service.
#
# Preconditions (owner-side, see docs/WBS_TF_06_F3B_PREP.md §Bootstrap):
#   1. DNS A/AAAA messe.klare-ki.de → 77.42.19.144, 2a01:4f9:c012:c1b5::1
#      (DNS-only, matching the mcp.klare-ki.de precedent).
#   2. Let's Encrypt certificate issued via:
#        sudo certbot --nginx -d messe.klare-ki.de \
#          --redirect --agree-tos -m <owner-email> --no-eff-email
#      Certbot will edit a bootstrap vhost in place; after issuance,
#      replace sites-available/messe.klare-ki.de with THIS file and reload.
#   3. Gateway running with APP_ORIGIN=https://messe.klare-ki.de so Origin
#      enforcement matches and session cookies carry Secure.

server {
    listen 80;
    listen [::]:80;
    server_name messe.klare-ki.de;

    # ACME HTTP-01 renewal via certbot --nginx is handled by certbot
    # editing this block during renewal. Everything else redirects.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name messe.klare-ki.de;

    ssl_certificate     /etc/letsencrypt/live/messe.klare-ki.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messe.klare-ki.de/privkey.pem;
    # Site-level TLS protocols inherit from /etc/nginx/nginx.conf
    # (TLSv1.2 TLSv1.3, ssl_prefer_server_ciphers on).

    # HSTS: only the edge sees TLS; Gateway is loopback. One year + preload-ready.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The Gateway already sends Content-Security-Policy, X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy, Permissions-Policy, Cache-Control.
    # Do NOT duplicate those here; duplicates would stack and defeat `no-store`.

    client_max_body_size 1m;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    # Preserve the exact request path and query — Gateway routes on them.
    # Do not add a trailing slash to proxy_pass and do not add any rewrite.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve what Gateway needs for Origin + request binding.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # Origin: Gateway performs strict equality against APP_ORIGIN using the
        # browser-supplied Origin header. Do NOT set or overwrite proxy Origin.

        # Keep response headers from Gateway intact (CSP, Set-Cookie, etc.).
        proxy_pass_request_headers on;
        proxy_hide_header X-Powered-By;

        proxy_buffering off;
    }
}
