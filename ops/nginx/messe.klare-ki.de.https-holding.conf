# WBS Trade Fair Assistant — HTTPS holding vhost (post-cert, pre-Gateway).
#
# Used between successful certbot issuance and successful Gateway cutover
# (and during rollback). Presents the TLS certificate but returns a plain
# 503 on every path, so no public request ever reaches an old Gateway with
# a mismatched APP_ORIGIN. Replace with messe.klare-ki.de.conf only after
# the loopback acceptance in docs/WBS_TF_06_F3B_PREP.md §6 has passed.
#
# This file ships without HSTS by design: a holding 503 must not teach a
# browser a long-term HTTPS commitment that might outlive a rollback.

server {
    listen 80;
    listen [::]:80;
    server_name messe.klare-ki.de;

    # Keep port 80 reachable so certbot renewal via HTTP-01 continues to
    # work; everything else gets a plain redirect to HTTPS, where the 503
    # is returned.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name messe.klare-ki.de;

    ssl_certificate     /etc/letsencrypt/live/messe.klare-ki.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messe.klare-ki.de/privkey.pem;

    # Deliberately no HSTS, no proxy_pass, no application headers.
    location / {
        default_type text/plain;
        return 503 "WBS Trade Fair Assistant: service not yet enabled.\n";
    }
}
